# Local development database. Throwaway credentials, bound to this machine only.
# Postgres 17 to match Supabase. Port 5433 so it can't clash with a local install.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
